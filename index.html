<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>17K 富士山動態訓練 Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#20242a;--muted:#707780;--line:#e1e4e8;--accent:#55745b;--soft:#edf3ee;--red:#fde8e8;--redtext:#8a2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1080px;margin:auto;padding:24px 16px 50px}.grid4,.grid3,.coach{display:grid;gap:12px}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.coach{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.label,.muted{color:var(--muted);font-size:13px}.big{font-size:28px;font-weight:750;margin:4px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h2{font-size:18px;margin:0 0 4px}section{margin-top:16px}.bar{height:14px;border-radius:99px;background:#e8ece9;overflow:hidden;margin-top:14px}.bar>div{height:100%;background:var(--accent);border-radius:99px}.btn{border:1px solid var(--accent);background:white;color:var(--accent);border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.pill{background:var(--soft);border-radius:99px;padding:7px 11px;font-size:12px}.next{border:1px solid var(--line)}
.timeline{position:relative;margin-top:14px}.timeline-line{position:absolute;left:16.66%;right:16.66%;top:22px;height:2px;background:var(--line)}.timeline-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;position:relative}.timeline-item{text-align:center;min-width:0}.timeline-node{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-weight:800;cursor:pointer;position:relative;z-index:2;transition:.18s}.timeline-card{margin-top:10px;text-align:left;cursor:pointer;transition:.18s}.timeline-card.active,.timeline-node.active{background:var(--red);border-color:#d96b6b}.timeline-node.active{background:#d96b6b;color:white}.timeline-card.missed{background:#f4f4f5;border-style:dashed}.timeline-node.missed{background:#f4f4f5;border-style:dashed;color:#777}.detail{margin-top:16px;background:#f2f3f4;border:1px solid var(--line);border-radius:16px;padding:18px}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.detail-box{background:white;border:1px solid var(--line);border-radius:12px;padding:12px}.segments{width:100%;min-width:560px}.view-switch{display:flex;gap:6px}.iconbtn{border:1px solid var(--line);background:white;border-radius:9px;padding:8px 11px;cursor:pointer}.iconbtn.active{border-color:var(--accent);background:var(--soft)}.volume-card{display:flex;align-items:center;gap:18px;margin:14px 0}.ring{--p:0;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),#e7e9e8 0);display:grid;place-items:center;flex:0 0 auto}.ring:after{content:"";width:82px;height:82px;background:white;border-radius:50%;grid-area:1/1}.ringtext{grid-area:1/1;z-index:1;text-align:center;font-weight:800;font-size:22px}.ringtext small{display:block;font-size:10px;color:var(--muted);font-weight:500}.calendar-wrap{overflow-x:auto}.calendar{min-width:650px;display:grid;grid-template-columns:repeat(7,1fr)}.calhead{text-align:center;padding:8px;font-size:12px;color:var(--muted);font-weight:700}.calday{min-height:90px;border:1px solid var(--line);padding:7px}.calday.empty{background:#fafafa}.calsession{display:block;width:100%;margin-top:5px;padding:5px;border:1px solid var(--line);border-radius:7px;background:#f6f7f9;text-align:left;font-size:11px;cursor:pointer}.calsession.done{background:var(--soft)}.calsession.next{border-color:#d96b6b}.currentrow{background:#f5f8f5}.hidden-detail{display:none}@media(hover:hover) and (pointer:fine){.timeline-card:hover,.timeline-node:hover{background:var(--red);border-color:#df8b8b}}table{border-collapse:collapse;width:100%;min-width:700px}th,td{text-align:left;padding:12px 9px;border-top:1px solid var(--line);font-size:14px}th{color:var(--muted);border-top:0}.scroll{overflow-x:auto}.attention{background:var(--red);color:var(--redtext)}#fullPlan[hidden]{display:none}.coach>div{min-width:0}.rule{background:#f2f3f4;border-radius:10px;padding:12px}.status{font-weight:700}.foot{margin-top:18px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:760px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3,.coach,.detail-grid{grid-template-columns:1fr}.timeline-line{display:none}.timeline-grid{grid-template-columns:1fr}.timeline-node{display:none}.timeline-item{text-align:left}.wrap{padding-top:14px}.big{font-size:23px}}
</style></head>
<body><main class="wrap">
<div id="summary" class="grid4"></div>
<section class="card"><div class="row"><div><h2>17K 距離進度</h2><div class="muted">以目前最長單次跑步距離計算</div></div><div style="text-align:right"><div class="big" id="progressPct">—</div><div class="muted" id="progressText"></div></div></div><div class="bar"><div id="progressBar" style="width:0"></div></div></section>
<section><div class="row"><div><h2 id="weekTitle">本週動態課表</h2><div class="muted">最近一次已完成 → 下一次訓練 → 後續訓練</div></div><div class="row"><span class="pill">依 Garmin 表現動態調整</span><button class="btn" id="toggle">查看動態課表</button></div></div><div class="timeline"><div class="timeline-line"></div><div class="timeline-grid" id="weekCards"></div></div><div class="detail hidden-detail" id="courseDetail"><div class="row"><div><div class="label" id="detailState">課程詳情</div><h2 id="detailTitle"></h2></div><span class="pill" id="detailBadge">Training Detail</span></div><div class="detail-grid" style="margin-top:14px"><div><b>主要目標</b><p class="muted" id="detailGoal"></p></div><div><b>建議強度</b><p class="muted" id="detailRpe"></p></div><div><b>完成標準</b><p class="muted" id="detailSuccess"></p></div></div><div class="detail-box scroll" style="margin-top:14px"><b>完整分段配速課表</b><table class="segments"><thead><tr><th>階段</th><th>距離</th><th>目標配速</th><th>執行重點</th></tr></thead><tbody id="segmentBody"></tbody></table></div><div class="detail-box" style="margin-top:14px"><b>這堂課最重要的一件事</b><p class="muted" id="detailKey"></p></div></div></section>
<section class="card" id="fullPlan" hidden><div class="row"><div><h2>完整 15 週動態課表</h2><div class="muted">每次訓練後可依實際成果調整</div></div><div class="row"><span class="pill">Dynamic Plan</span><div class="view-switch"><button class="iconbtn active" id="tableMode" title="表格檢視">☷</button><button class="iconbtn" id="calendarMode" title="月曆檢視">📅</button></div></div></div><div class="volume-card"><div class="ring" id="weekRing"><div class="ringtext"><span id="weekPct">0%</span><small>本週完成</small></div></div><div><div class="label">W3｜本週跑量</div><div class="big" id="weekVolumeText">—</div><div class="muted" id="weekVolumeSub"></div></div></div><div id="tablePlan" class="scroll"><table><thead><tr><th>週</th><th>日期</th><th>週二</th><th>週四</th><th>週日長跑</th><th>當週總跑量</th><th>週重點</th></tr></thead><tbody id="planBody"></tbody></table></div><div id="calendarPlan" hidden><div class="row" style="margin-bottom:10px"><button class="iconbtn" id="prevMonth">‹</button><b id="monthTitle"></b><button class="iconbtn" id="nextMonth">›</button></div><div class="calendar-wrap"><div class="calendar" id="calendarGrid"></div></div></div></section>
<section class="card"><h2>每日執行成果</h2><div class="muted" id="resultWeek"></div><div class="scroll"><table><thead><tr><th>日期</th><th>課表</th><th>原定</th><th>實際</th><th>配速</th><th>心率</th><th>成果</th></tr></thead><tbody id="results"></tbody></table></div></section>
<section class="card"><div class="row"><div><h2>動態教練判斷</h2><div class="muted">依實際訓練成果更新</div></div><span class="pill" id="coachDate"></span></div><div class="coach" id="coach" style="margin-top:16px"></div></section>
<div class="foot" id="updated"></div>
</main>
<script>
fetch('data.json?ts='+Date.now()).then(r=>r.json()).then(d=>{
 const pct=Math.min(100,Math.round(d.longest/17*100));
 document.querySelector('#summary').innerHTML=[
 ['比賽目標','17 KM','12/13 富士山'],['目標完賽','< 2:00','目標均速 7:03/km'],['目前最長實績',d.longest.toFixed(2)+' KM',pct+'% of 17K'],['目標狀態',d.goalStatus,d.goalNote]
 ].map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="big">'+x[1]+'</div><div class="muted">'+x[2]+'</div></div>').join('');
 progressPct.textContent=pct+'%';progressText.textContent=d.longest.toFixed(2)+' / 17 KM';progressBar.style.width=pct+'%';
 weekTitle.innerHTML='本週動態課表 <span class="muted">｜第 '+d.currentWeek+' 週・'+d.weekRange+'</span>';
 const sessions=d.weekSessions.slice(0,3);const labels=['最近一次已完成','下一次訓練','後續訓練'];weekCards.innerHTML=sessions.map((s,i)=>{const missed=!s.done&&!s.next&&i===0;return '<article class="timeline-item"><button class="timeline-node '+(missed?'missed':'')+'" data-i="'+i+'" type="button">'+(missed?'×':s.done?'✓':i===1?'▶':'→')+'</button><div class="label" style="margin-top:8px;font-weight:700">'+(missed?'上次未完成':labels[i])+'</div><div class="muted">'+s.date+'</div><b>'+s.type+'</b><div class="card timeline-card '+(missed?'missed':'')+'" data-i="'+i+'"><div class="big">'+s.main+'</div><div class="muted">'+s.sub+'</div><p>'+s.note+'</p></div></article>'}).join('');
 const details=sessions.map((s,i)=>({state:labels[i],title:s.date+'｜'+s.type,badge:s.done?'DONE':s.next?'NEXT':'UP NEXT',goal:s.detail?.goal||s.note,rpe:s.detail?.rpe||'依體感控制',segments:s.detail?.segments||[['全程',s.main,s.sub,s.note]],success:s.detail?.success||'穩定完成預定距離。',key:s.detail?.key||s.note}));
 function selectCourse(i){document.querySelectorAll('.timeline-card,.timeline-node').forEach(x=>x.classList.toggle('active',Number(x.dataset.i)===i));const x=details[i];courseDetail.classList.remove('hidden-detail');detailState.textContent=x.state;detailTitle.textContent=x.title;detailBadge.textContent=x.badge;detailGoal.textContent=x.goal;detailRpe.textContent=x.rpe;detailSuccess.textContent=x.success;detailKey.textContent=x.key;segmentBody.innerHTML=x.segments.map(a=>'<tr><td><b>'+a[0]+'</b></td><td>'+a[1]+'</td><td>'+a[2]+'</td><td>'+a[3]+'</td></tr>').join('')}
 document.querySelectorAll('.timeline-card,.timeline-node').forEach(x=>{x.addEventListener('click',()=>selectCourse(Number(x.dataset.i)));x.setAttribute('tabindex','0')});
 planBody.innerHTML=d.plan.map(p=>'<tr class="'+(p.week===d.currentWeek?'currentrow':'')+'"><td><b>'+p.week+'</b></td><td>'+p.range+'</td><td>'+p.tue+'</td><td>'+p.thu+'</td><td>'+p.sun+'</td><td><b>'+p.volume+'</b></td><td>'+p.focus+'</td></tr>').join('');const wv=d.weekVolume,pv=Math.round(wv.completed/((wv.targetMin+wv.targetMax)/2)*100);weekRing.style.setProperty('--p',pv);weekPct.textContent=pv+'%';weekVolumeText.textContent=wv.completed.toFixed(2)+' / '+wv.targetMin+'–'+wv.targetMax+' KM';weekVolumeSub.textContent='已完成 '+wv.completed.toFixed(2)+'K ｜ 本週預計 '+wv.targetMin+'–'+wv.targetMax+'K ｜ '+wv.completedSessions+' / '+wv.totalSessions+' 堂';
 resultWeek.textContent='第 '+d.currentWeek+' 週・'+d.weekRange;
 results.innerHTML=d.results.map(r=>'<tr class="'+(r.attention?'attention':'')+'"><td><b>'+r.date+'</b></td><td>'+r.type+'</td><td>'+r.planned+'</td><td>'+r.actual+'</td><td>'+r.pace+'</td><td>'+r.hr+'</td><td>'+r.outcome+'</td></tr>').join('');
 coachDate.textContent='對應 '+d.coach.date+' 訓練';
 coach.innerHTML=[['目前階段',d.coach.stage],['本週重點',d.coach.focus],['下一個里程碑',d.coach.milestone],['調整規則','🟢 有餘裕 → 進階<br>🟡 偏累 → 維持<br>🔴 疼痛／未完成 → 降量']].map((x,i)=>'<div class="'+(i===3?'rule':'')+'"><b>'+x[0]+'</b><p class="muted">'+x[1]+'</p></div>').join('');
 let calMonth=8;function drawCal(){monthTitle.textContent='2026 年 '+(calMonth+1)+' 月';const g=calendarGrid,heads=['週一','週二','週三','週四','週五','週六','週日'];g.innerHTML=heads.map(x=>'<div class="calhead">'+x+'</div>').join('');const first=new Date(Date.UTC(2026,calMonth,1)),days=new Date(Date.UTC(2026,calMonth+1,0)).getUTCDate(),off=(first.getUTCDay()+6)%7;for(let i=0;i<off;i++)g.insertAdjacentHTML('beforeend','<div class="calday empty"></div>');const start=new Date(Date.UTC(2026,7,31));for(let day=1;day<=days;day++){const dt=new Date(Date.UTC(2026,calMonth,day)),diff=Math.round((dt-start)/86400000),wi=Math.floor(diff/7),dow=dt.getUTCDay();let name='';if(wi>=0&&wi<d.plan.length){const p=d.plan[wi];if(dow===2)name=p.tue;if(dow===4)name=p.thu;if(dow===0)name=p.sun}const done=calMonth===8&&day===15,next=calMonth===8&&day===17;g.insertAdjacentHTML('beforeend','<div class="calday"><div class="label">'+day+'</div>'+(name?'<button class="calsession '+(done?'done ':'')+(next?'next':'')+'">'+(done?'✓ ':'')+name+'</button>':'')+'</div>')}}drawCal();tableMode.onclick=()=>{tablePlan.hidden=false;calendarPlan.hidden=true;tableMode.classList.add('active');calendarMode.classList.remove('active')};calendarMode.onclick=()=>{tablePlan.hidden=true;calendarPlan.hidden=false;calendarMode.classList.add('active');tableMode.classList.remove('active')};prevMonth.onclick=()=>{if(calMonth>7){calMonth--;drawCal()}};nextMonth.onclick=()=>{if(calMonth<11){calMonth++;drawCal()}};updated.textContent='最後更新：'+d.updated;
}).catch(()=>{document.body.insertAdjacentHTML('afterbegin','<div style="padding:12px;background:#fde8e8">資料載入失敗，請稍後再試。</div>')});
const toggle=document.querySelector('#toggle'),full=document.querySelector('#fullPlan');toggle.addEventListener('click',()=>{full.hidden=!full.hidden;toggle.textContent=full.hidden?'查看動態課表':'收合動態課表';if(!full.hidden)full.scrollIntoView({behavior:'smooth',block:'start'})});
</script></body></html>
