<body><main class="wrap">

<div class="foot" id="updated"></div>
</main>
<script>
fetch('data.json?ts='+Date.now()).then(r=>r.json()).then(d=>{const progressPct=document.querySelector('#progressPct'),progressText=document.querySelector('#progressText'),progressBar=document.querySelector('#progressBar'),weekTitle=document.querySelector('#weekTitle'),weekCards=document.querySelector('#weekCards'),courseDetail=document.querySelector('#courseDetail'),detailState=document.querySelector('#detailState'),detailTitle=document.querySelector('#detailTitle'),detailBadge=document.querySelector('#detailBadge'),detailGoal=document.querySelector('#detailGoal'),detailRpe=document.querySelector('#detailRpe'),detailSuccess=document.querySelector('#detailSuccess'),detailKey=document.querySelector('#detailKey'),segmentBody=document.querySelector('#segmentBody'),planBody=document.querySelector('#planBody'),weekRing=document.querySelector('#weekRing'),weekPct=document.querySelector('#weekPct'),weekVolumeText=document.querySelector('#weekVolumeText'),weekVolumeSub=document.querySelector('#weekVolumeSub'),monthRing=document.querySelector('#monthRing'),monthKm=document.querySelector('#monthKm'),monthVolumeLabel=document.querySelector('#monthVolumeLabel'),monthVolumeText=document.querySelector('#monthVolumeText'),monthVolumeSub=document.querySelector('#monthVolumeSub'),resultWeek=document.querySelector('#resultWeek'),results=document.querySelector('#results'),monthTitle=document.querySelector('#monthTitle'),calendarGrid=document.querySelector('#calendarGrid'),tableMode=document.querySelector('#tableMode'),calendarMode=document.querySelector('#calendarMode'),tablePlan=document.querySelector('#tablePlan'),calendarPlan=document.querySelector('#calendarPlan'),prevMonth=document.querySelector('#prevMonth'),nextMonth=document.querySelector('#nextMonth'),updated=document.querySelector('#updated'),topWeekRange=document.querySelector('#topWeekRange'),topWeekRing=document.querySelector('#topWeekRing'),topWeekPct=document.querySelector('#topWeekPct'),topWeekKm=document.querySelector('#topWeekKm'),topWeekDone=document.querySelector('#topWeekDone'),topWeekSessions=document.querySelector('#topWeekSessions');
 const pct=Math.min(100,Math.round(d.longest/17*100));
 document.querySelector('#summary').innerHTML=[
 ['比賽目標','17 KM','12/13 富士山'],['目標完賽','< 2:00','目標均速 7:03/km'],['目前最長實績',d.longest.toFixed(2)+' KM',pct+'% of 17K'],['目標狀態',d.goalStatus,d.goalNote]
 ].map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="big">'+x[1]+'</div><div class="muted">'+x[2]+'</div></div>').join('');
 progressPct.textContent=pct+'%';progressText.textContent=d.longest.toFixed(2)+' / 17 KM';progressBar.style.width=pct+'%';
 weekTitle.innerHTML='本週動態課表 <span class="muted">｜第 '+d.currentWeek+' 週・'+d.weekRange+'</span>';
 const sessions=d.weekSessions.slice(0,3);const labels=['最近一次已完成','下一次訓練','後續訓練'];weekCards.innerHTML=sessions.map((s,i)=>{const missed=!s.done&&!s.next&&i===0;return '<article class="timeline-item"><button class="timeline-node '+(missed?'missed':'')+'" data-i="'+i+'" type="button">'+(missed?'×':s.done?'✓':i===1?'▶':'→')+'</button><div class="label" style="margin-top:8px;font-weight:700">'+(missed?'上次未完成':labels[i])+'</div><div class="muted">'+s.date+'</div><b>'+s.type+'</b><div class="card timeline-card '+(missed?'missed':'')+'" data-i="'+i+'"><div class="big">'+s.main+'</div><div class="muted">'+s.sub+'</div><p>'+s.note+'</p></div></article>'}).join('');
 const details=sessions.map((s,i)=>({state:labels[i],title:s.date+'｜'+s.type,badge:s.done?'DONE':s.next?'NEXT':'UP NEXT',goal:s.detail?.goal||s.note,rpe:s.detail?.rpe||'依體感控制',segments:s.detail?.segments||[['全程',s.main,s.sub,s.note]],success:s.detail?.success||'穩定完成預定距離。',key:s.detail?.key||s.note}));
 function selectCourse(i){document.querySelectorAll('.timeline-card,.timeline-node').forEach(x=>x.classList.toggle('active',Number(x.dataset.i)===i));const x=details[i],s=sessions[i];courseDetail.classList.remove('hidden-detail');detailState.textContent=x.state;detailTitle.textContent=x.title;detailBadge.textContent=x.badge;if(s.done){const rr=d.results.find(r=>r.type===s.type&&r.actual!=='—')||d.results.find(r=>r.actual!=='—');courseDetail.innerHTML='<div class="row"><div><div class="label">最近一次已完成</div><h2>'+x.title+'</h2></div><span class="pill">✓ DONE</span></div><div class="detail-box" style="margin-top:14px"><b>課程內容</b><p class="muted">原定：'+(rr?.planned||s.main)+' '+s.type+'</p></div><div style="margin-top:16px"><b>實際執行成果</b><div class="completed-summary"><div class="metric"><div class="label">實際距離</div><div class="big">'+(rr?.actual||s.main)+'</div></div><div class="metric"><div class="label">時間</div><div class="big">'+((s.sub.match(/\d+:\d+/)||['—'])[0])+'</div></div><div class="metric"><div class="label">平均配速</div><div class="big">'+(rr?.pace||'—')+'/km</div></div><div class="metric"><div class="label">平均心率</div><div class="big">'+(rr?.hr||'—')+'</div></div></div></div><div class="completed-coach"><div class="row"><b>動態教練判斷</b><span class="pill">'+(rr?.outcome||'訓練完成')+'</span></div><div class="completed-coach-grid" style="margin-top:12px"><div><div class="label">本次判斷</div><p>'+s.note+'</p></div><div><div class="label">對後續課表影響</div><p>'+d.coach.focus+'</p></div><div><div class="label">下一步</div><p>'+d.coach.milestone+'</p></div></div></div>';return}courseDetail.innerHTML='<div class="row"><div><div class="label">'+x.state+'</div><h2>'+x.title+'</h2></div><span class="pill">'+x.badge+'</span></div><div class="detail-grid" style="margin-top:14px"><div><b>主要目標</b><p class="muted">'+x.goal+'</p></div><div><b>建議強度</b><p class="muted">'+x.rpe+'</p></div><div><b>完成標準</b><p class="muted">'+x.success+'</p></div></div><div class="detail-box scroll" style="margin-top:14px"><b>完整分段配速課表</b><table class="segments"><thead><tr><th>階段</th><th>距離</th><th>目標配速</th><th>執行重點</th></tr></thead><tbody>'+x.segments.map(a=>'<tr><td><b>'+a[0]+'</b></td><td>'+a[1]+'</td><td>'+a[2]+'</td><td>'+a[3]+'</td></tr>').join('')+'</tbody></table></div><div class="detail-box" style="margin-top:14px"><b>這堂課最重要的一件事</b><p class="muted">'+x.key+'</p></div>'}
 document.querySelectorAll('.timeline-card,.timeline-node').forEach(x=>{x.addEventListener('click',()=>selectCourse(Number(x.dataset.i)));x.setAttribute('tabindex','0')});
 planBody.innerHTML=d.plan.map(p=>'<tr class="'+(p.week===d.currentWeek?'currentrow':'')+'"><td><b>'+p.week+'</b></td><td>'+p.range+'</td><td>'+p.tue+'</td><td>'+p.thu+'</td><td>'+p.sun+'</td><td><b>'+p.volume+'</b></td><td>'+p.focus+'</td></tr>').join('');const wv=d.weekVolume,pv=Math.round(wv.completed/((wv.targetMin+wv.targetMax)/2)*100);topWeekRange.textContent='W'+d.currentWeek+'｜'+d.weekRange;topWeekRing.style.setProperty('--p',pv);topWeekPct.textContent=pv+'%';topWeekKm.textContent=wv.completed.toFixed(2)+' / '+wv.targetMin+'–'+wv.targetMax+'K';topWeekDone.textContent='已完成 '+wv.completed.toFixed(2)+'K';topWeekSessions.textContent=wv.completedSessions+' / '+wv.totalSessions+' 堂';weekRing.style.setProperty('--p',pv);weekPct.textContent=pv+'%';weekVolumeText.textContent=wv.completed.toFixed(2)+' / '+wv.targetMin+'–'+wv.targetMax+' KM';weekVolumeSub.textContent='已完成 '+wv.completed.toFixed(2)+'K ｜ 本週預計 '+wv.targetMin+'–'+wv.targetMax+'K ｜ '+wv.completedSessions+' / '+wv.totalSessions+' 堂';
 resultWeek.textContent='第 '+d.currentWeek+' 週・'+d.weekRange;
 results.innerHTML=d.results.map(r=>'<tr class="'+(r.attention?'attention':'')+'"><td><b>'+r.date+'</b></td><td>'+r.type+'</td><td>'+r.planned+'</td><td>'+r.actual+'</td><td>'+r.pace+'</td><td>'+r.hr+'</td><td>'+r.outcome+'</td></tr>').join('');
 function updateMonthVolume(){const month=calMonth+1,actuals=month===9?d.results.filter(r=>r.actual!=='—'):[],km=actuals.reduce((sum,r)=>sum+(parseFloat(r.actual)||0),0),count=actuals.length;monthVolumeLabel.textContent='2026 / '+String(month).padStart(2,'0')+'｜本月跑量';monthKm.textContent=km.toFixed(2)+'K';monthVolumeText.textContent='累積 '+km.toFixed(2)+' KM';monthVolumeSub.textContent='已完成 '+count+' 次';monthRing.style.setProperty('--p',count?100:0)}
 let calMonth=8,selectedCalKey=null;

 function paceRange(values){const nums=[];values.forEach(v=>{for(const m of String(v).matchAll(/(\d+):(\d{2})/g))nums.push(Number(m[1])*60+Number(m[2]))});if(!nums.length)return null;const lo=Math.min(...nums),hi=Math.max(...nums),fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');return fmt(lo)+'–'+fmt(hi)+'/km'}
 function calPace(wi,dow,done){if(wi===d.currentWeek-1){const idx=dow===2?0:dow===4?1:dow===0?2:-1,s=idx>=0?d.weekSessions[idx]:null;if(s){if(done){const rr=d.results.find(r=>r.actual!=='—');return '實際配速 '+(rr?.pace||'—')+'/km'}const range=paceRange((s.detail?.segments||[]).map(a=>a[2]));if(range)return '配速 '+range}}return '配速依當週狀態動態調整'}
 function drawCal(){updateMonthVolume();monthTitle.textContent='2026 年 '+(calMonth+1)+' 月';const g=calendarGrid,heads=['週次','週一','週二','週三','週四','週五','週六','週日'];g.innerHTML=heads.map(x=>'<div class="calhead">'+x+'</div>').join('');const first=new Date(Date.UTC(2026,calMonth,1)),days=new Date(Date.UTC(2026,calMonth+1,0)).getUTCDate(),off=(first.getUTCDay()+6)%7,startPlan=new Date(Date.UTC(2026,7,31)),gridStart=new Date(Date.UTC(2026,calMonth,1-off)),cells=Math.ceil((off+days)/7)*7;for(let row=0;row<cells/7;row++){const mon=new Date(gridStart.getTime()+row*7*86400000),wi=Math.floor(Math.round((mon-startPlan)/86400000)/7),current=wi===d.currentWeek-1;g.insertAdjacentHTML('beforeend','<div class="calweek '+(current?'currentweek':'')+'">'+(wi>=0&&wi<d.plan.length?'W'+(wi+1):'')+'</div>');for(let col=0;col<7;col++){const dt=new Date(mon.getTime()+col*86400000),inMonth=dt.getUTCMonth()===calMonth,day=dt.getUTCDate(),dow=dt.getUTCDay();if(!inMonth){g.insertAdjacentHTML('beforeend','<div class="calday empty '+(current?'currentweek':'')+'"></div>');continue}let name='';if(wi>=0&&wi<d.plan.length){const p=d.plan[wi];if(dow===2)name=p.tue;if(dow===4)name=p.thu;if(dow===0)name=p.sun}name=String(name).replaceAll('品質跑','品質跑').replaceAll('節奏','品質');const done=calMonth===8&&day===15,next=calMonth===8&&day===17,key=calMonth+'-'+day,label=name?shortRunLabel(name):'',pace=name?calPace(wi,dow,done):'',rr=done?d.results.find(r=>r.actual!=='—'):null,actual=rr?'✓ 實際跑 '+rr.actual:'';g.insertAdjacentHTML('beforeend','<div class="calday '+(current?'currentweek':'')+'"><div class="label">'+day+'</div>'+(name?'<button type="button" data-calkey="'+key+'" class="calsession '+(done?'done ':'')+(next?'next ':'')+(selectedCalKey===key?'selected':'')+'"><span>'+label+'</span>'+(actual?'<span class="calactual">'+actual+'</span>':'')+'<span class="calpace">'+pace+'</span></button>':'')+'</div>')}}g.querySelectorAll('.calsession').forEach(b=>b.addEventListener('click',()=>{selectedCalKey=selectedCalKey===b.dataset.calkey?null:b.dataset.calkey;drawCal()}))}
 drawCal();tableMode.onclick=()=>{tablePlan.hidden=false;calendarPlan.hidden=true;tableMode.classList.add('active');calendarMode.classList.remove('active')};calendarMode.onclick=()=>{tablePlan.hidden=true;calendarPlan.hidden=false;calendarMode.classList.add('active');tableMode.classList.remove('active')};prevMonth.onclick=()=>{if(calMonth>7){calMonth--;drawCal()}};nextMonth.onclick=()=>{if(calMonth<11){calMonth++;drawCal()}};updated.textContent='最後更新：'+d.updated;
}).catch(()=>{document.body.insertAdjacentHTML('afterbegin','<div style="padding:12px;background:#fde8e8">資料載入失敗，請稍後再試。</div>')});
const toggle=document.querySelector('#toggle'),full=document.querySelector('#fullPlan');toggle.addEventListener('click',()=>{full.hidden=!full.hidden;toggle.textContent=full.hidden?'查看動態課表':'收合動態課表';if(!full.hidden){tablePlan.hidden=true;calendarPlan.hidden=false;tableMode.classList.remove('active');calendarMode.classList.add('active');full.scrollIntoView({behavior:'smooth',block:'start'})}});
</script></body></html>
